<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deasy embeds</title>
    <style>
      body { margin: 0; background: #2f2c25; color: #f0ebe3; font: 16px/1.5 system-ui, sans-serif; }
    </style>
    <script type="importmap">
      { "imports": { "vue": "https://unpkg.com/vue@3.5.43/dist/vue.esm-browser.prod.js" } }
    </script>
  </head>
  <body>
    <div id="how-it-works-site"></div>
    <div id="how-it-works-gunmetal-light"></div>
    <div id="how-it-works-gunmetal-dark"></div>
    <div id="rotating-document"></div>

    <script type="module">
      import { createApp, h } from 'vue'
      import { DeasyHowItWorks, DeasyRotatingDocument } from './vue.js'
      createApp({ render: () => h(DeasyHowItWorks) }).mount('#how-it-works-site')
      createApp({ render: () => h(DeasyHowItWorks, { design: 'gunmetal', colorMode: 'light' }) }).mount('#how-it-works-gunmetal-light')
      createApp({ render: () => h(DeasyHowItWorks, { design: 'gunmetal', colorMode: 'dark' }) }).mount('#how-it-works-gunmetal-dark')
      createApp({ render: () => h(DeasyRotatingDocument) }).mount('#rotating-document')
    </script>
  </body>
</html>
